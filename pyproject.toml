[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "dh"
version = "1.4.7"
description = "Typed filesystem, terminal, and parallel-processing utilities"
requires-python = ">=3.11"
dependencies = ["rich>=13", "loguru>=0.7"]
readme = "README.md"
authors = [{ name = "Isaac Onagh", email = "yesnacoc@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8", "ty", "joblib>=1.3", "tqdm>=4.66"]
parallel = ["joblib>=1.3", "tqdm>=4.66"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"
