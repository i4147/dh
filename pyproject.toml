[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "dh"
version = "1.4.7"
description = "A Python package named dh"
readme = "README.md"
authors = [{ name = "Isaac Onagh", email = "yesnacoc@gmail.com" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
[tool.setuptools.packages.find]
where = ["src"]
